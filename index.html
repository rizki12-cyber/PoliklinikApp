<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untukmu - Dari Nemo ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ffafbd;
            --secondary-pink: #ffc3a0;
            --glass: rgba(255, 255, 255, 0.75);
            --accent-red: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(45deg, #ffafbd, #ffc3a0, #ffafbd);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- WELCOME SCREEN --- */
        #welcome-screen {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: 1s ease-in-out;
        }

        .nemo-badge {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        .btn-start {
            padding: 15px 40px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
        }

        .btn-start:hover { transform: scale(1.05); }

        /* --- MAIN CONTENT --- */
        #main-content {
            display: none;
            opacity: 0;
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
            transition: 1.5s;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        h1 { font-family: 'Caveat', cursive; font-size: 3.5rem; color: var(--accent-red); }

        /* --- GALLERY --- */
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
        }

        .polaroid {
            background: white;
            padding: 12px 12px 35px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: 0.4s;
            width: 220px;
        }

        .polaroid img { width: 100%; height: 200px; object-fit: cover; }

        .polaroid:hover { transform: scale(1.1) rotate(0deg) !important; z-index: 10; }

        /* --- FLOATING HEARTS --- */
        .heart {
            position: fixed;
            color: var(--accent-red);
            pointer-events: none;
            z-index: 1500;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            from { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* --- POPUP --- */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .popup {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: pop 0.4s ease;
        }

        @keyframes pop { from { transform: scale(0.8); } to { transform: scale(1); } }

        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="nemo-badge">Ini dari Nemo</div>
        <h2 style="margin-bottom: 25px; color: #555;">Klik tombol di bawah...</h2>
        <button class="btn-start" onclick="startApp()">Buka Kejutan ✨</button>
    </div>

    <audio id="bg-music" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>
    <div class="music-btn" onclick="toggleMusic()">🎵</div>

    <div id="main-content">
        <div class="glass-card">
            <h1>Untuk Kamu</h1>
            <p id="typing-text" style="font-size: 1.2rem; min-height: 100px; color: #555;"></p>
        </div>

        <div class="gallery">
            <div class="polaroid" style="transform: rotate(-3deg);">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="1">
                <p style="text-align:center; margin-top:10px; font-family: 'Caveat';">Manis ✨</p>
            </div>
            <div class="polaroid" style="transform: rotate(3deg);">
                <img src="https://images.unsplash.com/photo-1516589174184-c68566f3d200?w=400" alt="2">
                <p style="text-align:center; margin-top:10px; font-family: 'Caveat';">Ceria 😊</p>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn-start" onclick="openPopup()">Klik Ini Terakhir 💌</button>
        </div>

        <footer style="text-align: center; margin-top: 50px; color: white;">
            Dibuat dengan ❤️ oleh Nemo untukmu
        </footer>
    </div>

    <div class="overlay" id="overlay" onclick="closePopup()">
        <div class="popup" onclick="event.stopPropagation()">
            <h3 style="color: var(--accent-red); font-family: 'Caveat'; font-size: 2rem;">Hai Cantik...</h3>
            <p style="margin: 20px 0; color: #666; line-height: 1.6;">
                "Seperti lagu Tulus tadi, kamu adalah teman hidup yang luar biasa. Terima kasih sudah selalu ada."
            </p>
            <p style="font-weight: bold; color: var(--accent-red);">- Ini dari Nemo -</p>
            <br>
            <button class="btn-start" style="padding: 10px 20px;" onclick="closePopup()">Tutup</button>
        </div>
    </div>

    <script>
        function startApp() {
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
                const main = document.getElementById('main-content');
                main.style.display = 'block';
                setTimeout(() => {
                    main.style.opacity = '1';
                    typeWriter();
                    setInterval(createHeart, 500);
                }, 100);
            }, 1000);

            const music = document.getElementById('bg-music');
            music.play();
        }

        const text = "Kadang Nemo bingung mau bilang apa, tapi yang jelas, kehadiranmu bikin semuanya jadi lebih bermakna. Seperti lirik lagu ini, tetaplah jadi teman hidup yang paling manis ya...";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️', '💖', '✨', '🌸'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }

        function openPopup() { document.getElementById('overlay').style.display = 'flex'; }
        function closePopup() { document.getElementById('overlay').style.display = 'none'; }
        function toggleMusic() {
            const m = document.getElementById('bg-music');
            m.paused ? m.play() : m.pause();
        }
    </script>
</body>
</html>
